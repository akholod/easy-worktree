[package]
name = "ewtm"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
globset = { version = "0.4.20", default-features = false }
fs4 = "1.1"
sha2 = "0.10.9"
uuid = { version = "1.24", default-features = false, features = ["std", "v4", "serde"] }
thiserror = "2.0.17"
toml = "0.9.8"
unicode-normalization = "0.1.25"

[dev-dependencies]
tempfile = "3"
